{# Parâmetros: titulo, valor, unidade (opcional), legenda, tom, icone, atraso (ms) #}
<article class="cartao animar-entrada p-5" data-tom="{{ tom }}" style="animation-delay: {{ atraso|default:0 }}ms">
  <div class="flex items-start justify-between gap-3 pr-3">
    <h3 class="rotulo">{{ titulo }}</h3>
    <span class="icone-tom">{% include "components/icon.html" with nome=icone classe="size-[18px]" %}</span>
  </div>
  <p class="mt-5 flex items-baseline gap-1.5">
    <span class="text-4xl font-bold tracking-tight tabular-nums" data-contador>{{ valor }}</span>
    {% if unidade %}<span class="text-sm text-muted">{{ unidade }}</span>{% endif %}
  </p>
  <p class="mt-1 text-sm text-muted">{{ legenda }}</p>
</article>
