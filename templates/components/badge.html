{# Parâmetro: estado (atrasado, 7_dias, 30_dias, 60_dias, ok) #}
<span class="badge" data-estado="{{ estado }}"><span class="ponto"></span>{% if estado == "atrasado" %}Atrasado{% elif estado == "7_dias" %}7 dias{% elif estado == "30_dias" %}30 dias{% elif estado == "60_dias" %}60 dias{% else %}Em dia{% endif %}</span>
