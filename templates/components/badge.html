{% comment %}Parametro: estado (atrasado | 7_dias | 30_dias | 60_dias | ok){% endcomment %}
{% if estado == "atrasado" %}<span class="inline-flex items-center gap-1.5 rounded-full bg-danger-soft px-2.5 py-1 text-xs font-medium text-danger"><span class="size-1.5 rounded-full bg-danger"></span>Atrasado</span>
{% elif estado == "7_dias" %}<span class="inline-flex items-center gap-1.5 rounded-full bg-warn-soft px-2.5 py-1 text-xs font-medium text-warn"><span class="size-1.5 rounded-full bg-warn"></span>7 dias</span>
{% elif estado == "30_dias" %}<span class="inline-flex items-center gap-1.5 rounded-full bg-caution-soft px-2.5 py-1 text-xs font-medium text-caution"><span class="size-1.5 rounded-full bg-caution"></span>30 dias</span>
{% elif estado == "60_dias" %}<span class="inline-flex items-center gap-1.5 rounded-full bg-accent-soft px-2.5 py-1 text-xs font-medium text-accent"><span class="size-1.5 rounded-full bg-accent"></span>60 dias</span>
{% else %}<span class="inline-flex items-center gap-1.5 rounded-full bg-ok-soft px-2.5 py-1 text-xs font-medium text-ok"><span class="size-1.5 rounded-full bg-ok"></span>Em dia</span>{% endif %}
