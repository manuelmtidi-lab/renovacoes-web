{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl animar-entrada">
  <h1 class="text-2xl font-bold tracking-tight">{{ titulo }}</h1>
  <div class="cartao sem-brilho mt-6 p-6">
    <p>Vai apagar <strong>{{ objecto }}</strong>.</p>
    <p class="mt-3 text-sm text-muted">{{ aviso }}</p>
    <form method="post" class="mt-6 flex flex-wrap justify-end gap-3 border-t border-line pt-5">
      {% csrf_token %}
      <a href="{{ voltar }}" class="btn">Cancelar</a>
      <button type="submit" class="btn btn-perigo-cheio">Apagar</button>
    </form>
  </div>
</div>
{% endblock %}
