<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem ligação · Renovações</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0a;color:#f5f5f5;font-family:system-ui,sans-serif;text-align:center;padding:1.5rem}
    h1{font-size:1.5rem;margin:0 0 .5rem}
    p{color:#a3a3a3;margin:0 0 1.5rem;max-width:28rem}
    button{background:#76b900;color:#0a0a0a;border:0;padding:.7rem 1.4rem;font-weight:700;border-radius:.5rem;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Sem ligação à internet</h1>
    <p>Por segurança, os dados dos clientes não ficam guardados no telemóvel. Volte a ligar-se e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
