{% load tailwind_cli static %}<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Entrar{% endblock %} · Renovações</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tema");
        var escuro = t ? t === "dark" : true;
        document.documentElement.classList.toggle("dark", escuro);
      } catch (e) {}
    })();
  </script>
  {% tailwind_css %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="min-h-screen bg-bg font-sans text-ink antialiased">
  <canvas id="fundo" class="fundo-login" aria-hidden="true"></canvas>
  <div class="login-brilho" aria-hidden="true"></div>
  <div class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10">
    <main class="login-cartao w-full max-w-sm p-8">
      <div class="entra flex items-center gap-3" style="--i: 0">
        {% include "components/logo.html" with tamanho="44" %}
        <span class="login-rotulo">Contratos de clientes</span>
      </div>
      {% block corpo %}{% endblock %}
    </main>
  </div>
  <script src="{% static 'js/login-fundo.js' %}" defer></script>
  <script src="{% static 'js/instalar.js' %}" defer></script>
</body>
</html>
